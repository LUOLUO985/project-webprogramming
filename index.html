<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finnish Statistics Portal</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toolbar">
        <select id="indicator">
            <option value="employment">Employment Rate</option>
            <option value="unemployment">Unemployment Rate</option>
            <option value="dependency">Dependency Ratio</option> 
            <option value="election">Election winner</option>
            <option value="over65">Age 65+</option>
            <option value="popChange">population change</option>
            <option value="custom">Custom formula</option>
        </select>
        <select id= "year"></select>
        <button id="export">Export PNG</button>
        <select id="itemA"></select>
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>

        </select>
        <select id="itemB"></select>
    </div>
    <div class="content">
        <div id="map"></div>
        <div id ="panel">
            <h2 id ="panel-title">click a town</h2>
            <div id="chart"></div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://unpkg.com/echarts@5.5.1/dist/echarts.min.js"></script>

    <script src="data.js"></script>
    <script src="charts.js"></script>
    <script src="script.js"></script>
</body>
</html>
